name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Configurar npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Build Docker
        run: docker build -t devops-tasks-api:${{ github.sha }} .
      - name: CI aprovado
        run: echo 'CI aprovado ✅'
