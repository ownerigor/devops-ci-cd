name: CD — deploy local

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no Docker da máquina da palestra
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, etec-local]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout do commit validado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build e deploy local do commit aprovado
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ./scripts/deploy-local.ps1 -CommitSha $env:DEPLOY_SHA
      - name: API publicada
        run: |
          '### Deploy local concluído' >> $env:GITHUB_STEP_SUMMARY
          'API disponível na máquina da palestra: http://localhost:3000/health' >> $env:GITHUB_STEP_SUMMARY
